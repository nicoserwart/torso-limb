<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torso / Limbs Hypertrophy Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-gold: #d29922;
            --accent-red: #da3633;
            --accent-purple: #a371f7;
            --input-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid var(--card-border);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: #f0f6fc;
            font-weight: 700;
        }

        .stats-badge {
            font-size: 0.75rem;
            background: #21262d;
            padding: 4px 8px;
            border-radius: 12px;
            color: var(--accent-blue);
            border: 1px solid var(--card-border);
        }

        .timer-bar {
            background: #21262d;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--card-border);
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--accent-gold);
        }

        .timer-btn {
            background: #30363d;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            background: #161b22;
            border-bottom: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: #21262d;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .deload-banner {
            background: rgba(210, 153, 34, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 15px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .exercise-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f0f6fc;
        }

        .pr-badge {
            font-size: 0.75rem;
            color: var(--accent-gold);
            background: rgba(210, 153, 34, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(210, 153, 34, 0.3);
            white-space: nowrap;
        }

        .notes-box {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notes-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .progression-banner {
            background: rgba(88, 166, 255, 0.1);
            border-left: 3px solid var(--accent-blue);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        .sets-table th {
            text-align: left;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-bottom: 6px;
        }

        .sets-table td {
            padding: 4px 2px;
            vertical-align: middle;
        }

        .set-type-tag {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-purple);
        }

        .set-target {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .last-data {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .input-group {
            display: flex;
            gap: 4px;
        }

        .num-input {
            width: 58px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 6px 4px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .num-input:focus {
            border-color: var(--accent-blue);
            outline: none;
        }

        .warmup-btn {
            background: #21262d;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            cursor: pointer;
            margin-top: 4px;
        }

        .warmup-display {
            font-size: 0.75rem;
            color: var(--accent-gold);
            background: #0d1117;
            padding: 6px;
            border-radius: 6px;
            margin-top: 4px;
            display: none;
        }

        .history-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 0;
            width: 100%;
            text-align: left;
        }

        .history-panel {
            display: none;
            background: #0d1117;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            max-height: 120px;
            overflow-y: auto;
        }

        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161b22;
            border-top: 1px solid var(--card-border);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 100;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            flex: 1;
            max-width: 300px;
            text-align: center;
        }

        .btn-secondary {
            background: #21262d;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            width: 100%;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f0f6fc;
        }

        .modal-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: #21262d;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Torso / Limbs Tracker</h1>
            <div class="stats-badge" id="headerStats">Einheiten: 0</div>
        </div>
        <div class="timer-bar">
            <span>⏱️ Pausentimer:</span>
            <span class="timer-display" id="timerDisplay">02:00</span>
            <div>
                <button class="timer-btn" onclick="toggleTimer()">Start / Stop</button>
                <button class="timer-btn" onclick="resetTimer(120)">2m</button>
                <button class="timer-btn" onclick="resetTimer(180)">3m</button>
            </div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchDay('torsoA', this)">Mo: Torso A</button>
        <button class="tab-btn" onclick="switchDay('limbsA', this)">Di: Limbs A</button>
        <button class="tab-btn" onclick="switchDay('torsoB', this)">Do: Torso B</button>
        <button class="tab-btn" onclick="switchDay('limbsB', this)">Fr: Limbs B</button>
    </div>

    <div class="container">
        <div id="deloadContainer"></div>
        <div id="exercisesContainer"></div>
    </div>

    <div class="action-bar">
        <button class="btn-primary" onclick="saveCurrentSession()">💾 Einheit Speichern</button>
        <button class="btn-secondary" onclick="openSettings()">⚙️ Menü</button>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title">Optionen & Daten</div>
            <button class="modal-btn" onclick="exportData()">📥 Backup exportieren (JSON)</button>
            <button class="modal-btn" onclick="importDataPrompt()">📤 Backup importieren</button>
            <button class="modal-btn" style="color: var(--accent-red);" onclick="confirmClearAllData()">🚨 Alle Daten zurücksetzen</button>
            <button class="modal-btn" style="margin-bottom: 0;" onclick="closeSettings()">Schließen</button>
        </div>
    </div>

    <script>
        // --- WORKOUT DATA STRUCTURE ---
        const workoutData = {
            torsoA: [
                { id: 'tA_1', name: '1. Schrägbankdrücken', incr: 2.5, sets: [{ type: 'Top-Satz', min: 5, max: 8 }, { type: 'Back-off', min: 8, max: 10 }] },
                { id: 'tA_2', name: '2. Latzug (Neutral/Untergriff)', incr: 2.5, sets: [{ type: 'Top-Satz', min: 6, max: 10 }, { type: 'Back-off', min: 8, max: 12 }] },
                { id: 'tA_3', name: '3. Brustgestütztes Rudern', incr: 2.5, sets: [{ type: 'Top-Satz', min: 6, max: 10 }, { type: 'Back-off', min: 8, max: 12 }] },
                { id: 'tA_4', name: '4. Kabel-Flys', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'tA_5', name: '5. Seitheben', incr: 1.25, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 20 }] },
                { id: 'tA_6', name: '6. Reverse Fly', incr: 1.25, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 20 }] }
            ],
            limbsA: [
                { id: 'lA_1', name: '1. Hack Squat', incr: 2.5, sets: [{ type: 'Top-Satz', min: 5, max: 8 }, { type: 'Back-off', min: 8, max: 10 }] },
                { id: 'lA_2', name: '2. Romanian Deadlift (RDL)', incr: 2.5, sets: [{ type: 'Top-Satz', min: 6, max: 10 }, { type: 'Back-off', min: 8, max: 12 }] },
                { id: 'lA_3', name: '3. Beinbeuger sitzend', incr: 2.5, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lA_4', name: '4. Wadenheben stehend', incr: 2.5, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lA_5', name: '5. Bizepscurl (SZ/Kabel)', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lA_6', name: '6. Trizepsdrücken Kabel', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] }
            ],
            torsoB: [
                { id: 'tB_1', name: '1. Brustpresse', incr: 2.5, sets: [{ type: 'Top-Satz', min: 6, max: 10 }, { type: 'Back-off', min: 8, max: 12 }] },
                { id: 'tB_2', name: '2. Einarmiger Kabel-Latzug', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'tB_3', name: '3. Kabelrudern', incr: 2.5, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'tB_4', name: '4. Kabel-Flys', incr: 1.25, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 15 }] },
                { id: 'tB_5', name: '5. Seitheben', incr: 1.25, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 20 }] },
                { id: 'tB_6', name: '6. Reverse Fly', incr: 1.25, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 20 }] }
            ],
            limbsB: [
                { id: 'lB_1', name: '1. Beinpresse', incr: 5.0, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lB_2', name: '2. Beinbeuger sitzend/liegend', incr: 2.5, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lB_3', name: '3. Beinstrecker', incr: 2.5, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 15 }] },
                { id: 'lB_4', name: '4. Wadenheben sitzend', incr: 2.5, sets: [{ type: 'Top-Satz', min: 10, max: 15 }, { type: 'Back-off', min: 12, max: 15 }] },
                { id: 'lB_5', name: '5. Schrägbankcurl', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] },
                { id: 'lB_6', name: '6. Overhead-Trizepsstrecken', incr: 1.25, sets: [{ type: 'Top-Satz', min: 8, max: 12 }, { type: 'Back-off', min: 10, max: 15 }] }
            ]
        };

        let currentActiveDay = 'torsoA';
        let timerInterval = null;
        let timerSeconds = 120;

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            renderHeaderStats();
            renderDeloadBanner();
            renderView(currentActiveDay);
        }

        function switchDay(dayKey, btn) {
            currentActiveDay = dayKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderView(dayKey);
        }

        function renderView(dayKey) {
            const container = document.getElementById('exercisesContainer');
            container.innerHTML = '';
            const exercises = workoutData[dayKey];

            exercises.forEach((ex) => {
                const pr = getPR(ex.id);
                const lastHistory = getLastHistory(ex.id);
                const savedNote = localStorage.getItem(`note_${ex.id}`) || '';

                let autoProgressionMessages = [];
                let setsRowsHtml = '';

                ex.sets.forEach((setInfo, sIndex) => {
                    const lastSetData = lastHistory ? lastHistory.sets[sIndex] : null;
                    const lastWeight = lastSetData ? lastSetData.kg : '';
                    const lastReps = lastSetData ? lastSetData.reps : '';

                    let suggestedWeight = lastWeight;
                    if (lastSetData && lastSetData.reps >= setInfo.max) {
                        suggestedWeight = (parseFloat(lastWeight) + ex.incr).toString();
                        autoProgressionMessages.push(`📈 ${setInfo.type}: Max Wdh. (${lastReps}) erreicht! Ziel: ${suggestedWeight}kg (+${ex.incr}kg)`);
                    }

                    setsRowsHtml += `
                        <tr>
                            <td>
                                <div class="set-type-tag">${setInfo.type}</div>
                                <div class="set-target">${setInfo.min}–${setInfo.max} Wdh.</div>
                            </td>
                            <td class="last-data">
                                ${lastWeight ? `${lastWeight}kg × ${lastReps}` : '-'}
                            </td>
                            <td>
                                <div class="input-group">
                                    <input type="number" step="0.25" class="num-input" id="kg_${ex.id}_${sIndex}" placeholder="${suggestedWeight || 'kg'}" value="${suggestedWeight}">
                                    <input type="number" class="num-input" id="reps_${ex.id}_${sIndex}" placeholder="Wdh" value="">
                                </div>
                            </td>
                        </tr>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="exercise-header">
                        <div class="exercise-title">${ex.name}</div>
                        <div class="pr-badge">${pr ? `PR: ${pr.kg}kg × ${pr.reps}` : 'PR: -'}</div>
                    </div>
                    <div class="notes-box">
                        <span style="font-size:0.8rem;">📌</span>
                        <input type="text" class="notes-input" placeholder="Notiz (Sitzhöhe, Pins...)" value="${savedNote}" onchange="saveNote('${ex.id}', this.value)">
                    </div>
                    ${autoProgressionMessages.length > 0 ? `<div class="progression-banner">${autoProgressionMessages.join('<br>')}</div>` : ''}
                    <table class="sets-table">
                        <thead>
                            <tr>
                                <th>Satz Typ</th>
                                <th>Letztes Mal</th>
                                <th>Heute</th>
                            </tr>
                        </thead>
                        <tbody>${setsRowsHtml}</tbody>
                    </table>
                    <button class="warmup-btn" onclick="toggleWarmup('${ex.id}')">🔥 Warm-Up Rechner</button>
                    <div class="warmup-display" id="warmup_${ex.id}"></div>
                    <button class="history-toggle" onclick="toggleHistory('${ex.id}')">📜 Historie anzeigen</button>
                    <div class="history-panel" id="hist_${ex.id}">${renderHistoryList(ex.id)}</div>
                `;
                container.appendChild(card);
            });
        }

        function saveCurrentSession() {
            const exercises = workoutData[currentActiveDay];
            let hasData = false;

            exercises.forEach((ex) => {
                let sessionSets = [];
                ex.sets.forEach((setInfo, sIndex) => {
                    const kgEl = document.getElementById(`kg_${ex.id}_${sIndex}`);
                    const repsEl = document.getElementById(`reps_${ex.id}_${sIndex}`);
                    
                    if (kgEl && repsEl && kgEl.value && repsEl.value) {
                        const kg = parseFloat(kgEl.value);
                        const reps = parseInt(repsEl.value);
                        sessionSets.push({ kg, reps, type: setInfo.type });
                        hasData = true;
                        updatePR(ex.id, kg, reps);
                    }
                });

                if (sessionSets.length > 0) {
                    saveExerciseHistory(ex.id, sessionSets);
                }
            });

            if (hasData) {
                let count = parseInt(localStorage.getItem('global_session_count') || '0');
                count += 1;
                localStorage.setItem('global_session_count', count.toString());
                localStorage.setItem('global_last_session_date', new Date().toLocaleDateString('de-DE'));

                alert("✅ Trainingseinheit erfolgreich gespeichert!");
                initApp();
            } else {
                alert("⚠️ Bitte trage mindestens einen Satz ein!");
            }
        }

        function saveNote(exId, value) { localStorage.setItem(`note_${exId}`, value); }
        function updatePR(exId, kg, reps) {
            const currentPR = getPR(exId);
            if (!currentPR || kg > currentPR.kg || (kg === currentPR.kg && reps > currentPR.reps)) {
                localStorage.setItem(`pr_${exId}`, JSON.stringify({ kg, reps, date: new Date().toLocaleDateString('de-DE') }));
            }
        }
        function getPR(exId) { const data = localStorage.getItem(`pr_${exId}`); return data ? JSON.parse(data) : null; }
        function saveExerciseHistory(exId, sets) {
            let hist = getExerciseHistory(exId);
            hist.unshift({ date: new Date().toLocaleDateString('de-DE'), sets: sets });
            localStorage.setItem(`hist_${exId}`, JSON.stringify(hist));
        }
        function getExerciseHistory(exId) { const data = localStorage.getItem(`hist_${exId}`); return data ? JSON.parse(data) : []; }
        function getLastHistory(exId) { const hist = getExerciseHistory(exId); return hist.length > 0 ? hist[0] : null; }
        function renderHistoryList(exId) {
            const hist = getExerciseHistory(exId);
            if (hist.length === 0) return 'Keine bisherigen Einträge.';
            return hist.map(h => `<div style="margin-bottom:4px;"><b>${h.date}:</b> ${h.sets.map(s => `${s.kg}kg × ${s.reps}`).join(' | ')}</div>`).join('');
        }

        function toggleTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            else {
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimerDisplay();
                    if (timerSeconds <= 0) { clearInterval(timerInterval); timerInterval = null; alert("⏰ Pause vorbei!"); }
                }, 1000);
            }
        }
        function resetTimer(sec) { if (timerInterval) clearInterval(timerInterval); timerInterval = null; timerSeconds = sec; updateTimerDisplay(); }
        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }

        function toggleWarmup(exId) {
            const el = document.getElementById(`warmup_${exId}`);
            if (el.style.display === 'block') { el.style.display = 'none'; return; }
            const kgInput = document.getElementById(`kg_${exId}_0`);
            const targetKg = parseFloat(kgInput ? kgInput.value : 0);
            if (!targetKg || targetKg <= 0) {
                el.innerHTML = '<i>Trage zuerst ein Zielgewicht im Top-Set ein!</i>';
            } else {
                el.innerHTML = `<b>Aufwärmen:</b> 8×${(targetKg*0.5).toFixed(1)}kg | 3×${(targetKg*0.7).toFixed(1)}kg | 1×${(targetKg*0.9).toFixed(1)}kg`;
            }
            el.style.display = 'block';
        }

        function renderHeaderStats() {
            const count = localStorage.getItem('global_session_count') || '0';
            const lastDate = localStorage.getItem('global_last_session_date') || '-';
            document.getElementById('headerStats').textContent = `Einheiten: ${count} (${lastDate})`;
        }

        function renderDeloadBanner() {
            const count = parseInt(localStorage.getItem('global_session_count') || '0');
            const deloadContainer = document.getElementById('deloadContainer');
            if (count > 0 && count % 24 === 0) {
                deloadContainer.innerHTML = `<div class="deload-banner">⚠️ <b>DELOAD WOCHE!</b> Gewichte um 15-20% reduzieren.</div>`;
            } else { deloadContainer.innerHTML = ''; }
        }

        function toggleHistory(exId) {
            const el = document.getElementById(`hist_${exId}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
            const a = document.createElement('a'); a.href = dataStr; a.download = `torso_limbs_backup.json`; a.click();
        }
        function importDataPrompt() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
            input.onchange = e => {
                const reader = new FileReader();
                reader.readAsText(e.target.files[0], 'UTF-8');
                reader.onload = ev => {
                    const content = JSON.parse(ev.target.result);
                    localStorage.clear();
                    Object.keys(content).forEach(k => localStorage.setItem(k, content[k]));
                    alert("✅ Daten wiederhergestellt!"); location.reload();
                }
            };
            input.click();
        }
        function confirmClearAllData() {
            if (confirm("⚠️ Wirklich alle Daten zurücksetzen?")) { localStorage.clear(); initApp(); closeSettings(); }
        }
    </script>
</body>
</html>
